services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-u3code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-u3code_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-u3code_hub}
    volumes:
      - u3code_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-u3code} -d ${POSTGRES_DB:-u3code_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: ../..
      dockerfile: infra/hub/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-4310}
      DATABASE_URL: postgres://${POSTGRES_USER:-u3code}:${POSTGRES_PASSWORD:-u3code_change_me}@postgres:5432/${POSTGRES_DB:-u3code_hub}
    ports:
      - "${PORT:-4310}:4310"

  # Optional: Automatic HTTPS reverse proxy (uncomment when using a custom domain like hub.example.com)
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   depends_on:
  #     - hub
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   command: caddy reverse-proxy --from ${HUB_DOMAIN:-hub.example.com} --to hub:4310
  #   volumes:
  #     - u3code_hub_caddy_data:/data
  #     - u3code_hub_caddy_config:/config

volumes:
  u3code_hub_pgdata:
  # u3code_hub_caddy_data:
  # u3code_hub_caddy_config:
